<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Portfólio de Gabriel Juarez — IT Analyst e desenvolvedor." />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>Gabriel Juarez</title>
    <script>
      // Aplica o tema antes do React carregar, para não piscar o tema errado.
      // Mesma regra de getInitialTheme em src/lib/theme.js (chave 'theme').
      (function () {
        let theme;
        try {
          theme = localStorage.getItem('theme');
        } catch {
          // localStorage bloqueado: segue a preferência do sistema
        }
        if (theme !== 'light' && theme !== 'dark') {
          theme = matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
        }
        document.documentElement.dataset.theme = theme;
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
